[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overseer-archive"
version = "0.1.0"
description = "Offline, source-aware Fallout lore knowledge engine"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE-CODE"}
authors = [{name = "OVERSEER contributors"}]
dependencies = []

[project.scripts]
overseer = "overseer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/overseer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

